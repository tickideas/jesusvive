version: '3.9'

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_EVENT_DATE: ${NEXT_PUBLIC_EVENT_DATE}
      NEXT_PUBLIC_EVENT_NAME: ${NEXT_PUBLIC_EVENT_NAME}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      NEXT_PUBLIC_WHATSAPP_DEFAULT_MESSAGE: ${NEXT_PUBLIC_WHATSAPP_DEFAULT_MESSAGE}
      NEXT_PUBLIC_YOUTUBE_LIVE_ID: ${NEXT_PUBLIC_YOUTUBE_LIVE_ID}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jesusvive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: jesusvive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  pgdata:
